services:
  - type: web
    name: neofly-downloader-api
    runtime: python
    buildCommand: pip install -r requirements.txt && wget https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz && tar -xf ffmpeg-release-amd64-static.tar.xz && mkdir -p bin && mv ffmpeg-*-static/ffmpeg bin/ && mv ffmpeg-*-static/ffprobe bin/
    startCommand: export PATH=$PATH:$(pwd)/bin && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
